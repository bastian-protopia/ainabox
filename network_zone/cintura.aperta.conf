table inet cintura {
    set peer {
        type ipv4_addr
        flags interval
    }
    set cni {
        type ipv4_addr
        flags interval
    }
    chain input {
        type filter hook input priority -100; policy drop
        iifname "lo" accept
        ct state established,related accept
        ip saddr @peer tcp dport { 22, 8765, 11434, 3000, 8188, 22000 } accept
        ip saddr @peer udp dport 21027 accept
        ip saddr @cni tcp dport { 8765, 11434, 8000 } accept
    }
    chain output {
        type filter hook output priority -100; policy accept
    }
    chain forward {
        type filter hook forward priority -100; policy drop
    }
}
